name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          fail: true
          # Check source content files, but skip raw Liquid include/template files and
          # a few third-party endpoints that block automated requests.
          args: >-
            --user-agent 'curl/7.54'
            --verbose
            --no-progress
            --exclude-path README.md
            --exclude-path INSTALL.md
            --exclude-path FAQ.md
            --exclude-path _pages/404.md
            --exclude-path _pages/blog.md
            --exclude-path _posts/2018-12-22-distill.md
            --exclude-path _includes/**
            --exclude-path _layouts/**
            --exclude-path _sass/**
            --exclude-path vendor/**
            --exclude 'https://unsplash\.com/?$'
            --exclude 'https://ieeexplore\.ieee\.org/abstract/document/10325460/?$'
            './_pages/**/*.md'
            './_posts/**/*.md'
            './_news/**/*.md'
            './_projects/**/*.md'
            './**/*.html'
